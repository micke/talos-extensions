# Custom Talos installer for zeus (the NAS, a full cluster node since 2026-09-26).
#
# Mirrors the node's schematic (talos/nodes/controlplane/zeus.schematic.yaml.j2
# in home-cluster) and adds the NAS stack. Image Factory only serves official
# extensions, so the node is installed/upgraded from this image:
# `talosctl upgrade --image ghcr.io/micke/installer/zeus:<talosVersion>`, or by
# tuppr, which version-swaps the tag. Keep the kernel args and extension list
# in sync with the schematic. No Thunderbolt: the 10 GbE port is onboard.
#
# Extensions are resolved per release by hack/build-installer.sh: the official
# ones from factory.talos.dev/version/<talosVersion>/extensions/official (the
# kernel-module ones are built per Talos release), the rest as listed. The
# version here is what a manual build without --version uses; the
# micke-installer-auto workflow builds every newer stable release.
talosVersion: v1.14.2
extraKernelArgs:
  - -selinux
  - selinux=0
  - sysctl.kernel.kexec_load_disabled=1
officialExtensions:
  - siderolabs/drbd
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/util-linux-tools
  - siderolabs/zfs
  # NFS server: nfsd (kernel module, per release) and nfs-utils are in the
  # 1.14 catalogue; nfs-server first ships in extensions v1.15.0 and is taken
  # from the fallback below until the catalogue carries it.
  - siderolabs/nfsd
  - siderolabs/nfs-utils
  - siderolabs/nfs-server
fallbackExtensions:
  # Declares `>= v1.14.0` and pairs with the nfs-utils v0.1.1 that 1.14 ships.
  siderolabs/nfs-server: ghcr.io/siderolabs/nfs-server:v0.1.0@sha256:ef1f875598b4884a50eac9547c1015d637eb0b32d898275ef027112e203afa07
extraExtensions:
  # storage/mergerfs from this fork (micke-mergerfs workflow); resolved to a
  # digest at build time.
  - ghcr.io/micke/mergerfs:2.42.0

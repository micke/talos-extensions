# Fork-only (branch `micke`): build a Talos installer from
# micke/installers/<name>.yaml and push ghcr.io/micke/installer/<name>:<version>.
# The scheduled micke-installer-auto workflow builds new releases on its own;
# this one is for a first installer or a rebuild.
name: micke-installer

on:
  workflow_dispatch:
    inputs:
      name:
        description: micke/installers/<name>.yaml to build
        required: true
        default: zeus
      version:
        description: Talos release to build for (default from the definition's talosVersion)
        required: false
        default: ""

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Build and push
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$NAME" =~ ^[a-z0-9-]+$ ]] || { echo "invalid name" >&2; exit 1; }
          echo "$GH_TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          [[ -z "$VERSION" || "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version" >&2; exit 1; }
          ./micke/hack/build-installer.sh "$NAME" ${VERSION:+--version "$VERSION"} --push

# Custom Talos installer for zeus (the NAS, a full cluster node since 2026-09-26).
#
# Mirrors the node's schematic (talos/nodes/controlplane/zeus.schematic.yaml.j2
# in home-cluster, `talos` branch) and adds the NAS stack. Image Factory only
# serves official extensions, so the node is installed/upgraded from this
# image: `talosctl upgrade --image ghcr.io/micke/installer/zeus@sha256:<digest>`.
# Keep the kernel args and extension list in sync with the schematic. No
# Thunderbolt: the 10 GbE port is onboard.
talosVersion: v1.14.2
imager: ghcr.io/siderolabs/imager:v1.14.2@sha256:89d1b1e2be167632745abf7f6834220a255a0182714f3d91670ecad55a3c41ff
extraKernelArgs:
  - -selinux
  - selinux=0
  - sysctl.kernel.kexec_load_disabled=1
systemExtensions:
  # Same set as the schematic. Digests from factory.talos.dev/version/v1.14.2/extensions/official.
  - ghcr.io/siderolabs/drbd:9.3.4-v1.14.2@sha256:07d2be475e08b3c8b633319e7ed1e73d3e838836cfa734fef1bc0d45ea4b18d1
  - ghcr.io/siderolabs/i915:20260916-v1.14.2@sha256:ed2ea6d8733cefbb71c4303a9f19ad04d349b034cf842afebdd540fb5904e36e
  - ghcr.io/siderolabs/intel-ucode:20260812@sha256:5f3d4e4b7a3a6f08df6aa13afa8c476422ccb76ba63186a480fe0ce2e19aa921
  - ghcr.io/siderolabs/util-linux-tools:2.42.2@sha256:304c463024a9e3f427262d847e0a71b5d7548d29fcabd5259a79f405ac15842d
  - ghcr.io/siderolabs/zfs:2.4.4-v1.14.2@sha256:19f57dacaaac5689ec50c77c94e40051676215ef21700e37e5adf4b6055e3dc7
  # NFS server. nfs-server first ships in extensions v1.15.0-alpha.0 but
  # declares `>= v1.14.0` and pairs with the same nfs-utils v0.1.1 digest
  # that v1.14.2 ships.
  - ghcr.io/siderolabs/nfsd:v1.14.2@sha256:c2e17e6bd765dc3c54f74403e9cced08858f28a0ab124843b8f9686a49c54efa
  - ghcr.io/siderolabs/nfs-utils:v0.1.1@sha256:35ab2008b9bd1a189bfa0c173def2adcd691450298bfe9fa5bbb0b71ad7cc3aa
  - ghcr.io/siderolabs/nfs-server:v0.1.0@sha256:ef1f875598b4884a50eac9547c1015d637eb0b32d898275ef027112e203afa07
  # storage/mergerfs from this fork (micke-mergerfs workflow); resolved to a
  # digest at build time.
  - ghcr.io/micke/mergerfs:2.42.0

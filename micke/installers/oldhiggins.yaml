# Custom Talos installer for oldhiggins: the mergerfs PoC node (2026-09-22..26,
# retired in home-cluster before the full reinstall; the node runs the shared
# Image Factory schematic again). Kept as the second definition the build
# scripts are exercised on: the zeus stack plus Thunderbolt for the IOCREST
# HTB1131 (Thunderbolt 3 -> AQC113 10 GbE). Extensions resolved per release
# by hack/build-installer.sh, see zeus.yaml.
talosVersion: v1.14.1
extraKernelArgs:
  - -selinux
  - selinux=0
  - thunderbolt.host_reset=0
  - sysctl.kernel.kexec_load_disabled=1
officialExtensions:
  - siderolabs/drbd
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/thunderbolt
  - siderolabs/util-linux-tools
  - siderolabs/zfs
  - siderolabs/nfsd
  - siderolabs/nfs-utils
  - siderolabs/nfs-server
fallbackExtensions:
  siderolabs/nfs-server: ghcr.io/siderolabs/nfs-server:v0.1.0@sha256:ef1f875598b4884a50eac9547c1015d637eb0b32d898275ef027112e203afa07
extraExtensions:
  - ghcr.io/micke/mergerfs:2.42.0
